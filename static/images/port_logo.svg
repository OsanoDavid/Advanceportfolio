<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Vibrant Neon Gradients -->
    <linearGradient id="cn-magenta-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="50%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- White-Dominant Multicolor Text Gradient -->
    <linearGradient id="white-multicolor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="88%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>

    <!-- Drop Shadow / Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="500" height="500" fill="#0B0E17" rx="250"/>

  <!-- CN Monogram Icon Mark -->
  <g transform="translate(10, 15)">
    <!-- Outer 'C' Arch -->
    <path d="M 320 140 A 130 130 0 1 0 320 320" 
          fill="none" 
          stroke="url(#cn-magenta-violet)" 
          stroke-width="22" 
          stroke-linecap="round" 
          filter="url(#neon-glow)" />

    <!-- Inner 'N' Path -->
    <path d="M 200 310 L 200 170 L 290 310 L 290 170" 
          fill="none" 
          stroke="url(#cn-magenta-violet)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Connection Nodes -->
    <circle cx="320" cy="140" r="14" fill="#00F2FE" filter="url(#neon-glow)" />
    <circle cx="320" cy="320" r="14" fill="#FF2A85" filter="url(#neon-glow)" />
    <circle cx="200" cy="170" r="11" fill="#FFFFFF" />
    <circle cx="290" cy="310" r="11" fill="#FFFFFF" />
  </g>

</svg>
